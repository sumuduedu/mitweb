{% extends "base.html" %}

{% block content %}

<h3 class="mb-3">Edit Course</h3>

<!-- Flash messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}

<form method="POST">

    <div class="mb-3">
        <label>Course Name</label>
        <input type="text" name="name" class="form-control" value="{{ course.name }}" required>
    </div>

    <div class="mb-3">
        <label>Duration</label>
        <input type="text" name="duration" class="form-control" value="{{ course.duration }}">
    </div>

    <div class="mb-3">
        <label>Fee</label>
        <input type="number" name="fee" class="form-control" value="{{ course.fee }}">
    </div>

    <button class="btn btn-primary">Update</button>
    <a href="{{ url_for('courses.list_courses') }}" class="btn btn-secondary">Cancel</a>

</form>

{% endblock %}
