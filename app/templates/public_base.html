<!DOCTYPE html>
<html>
<head>
    <title>MIT Training Center</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }

        /* LIGHT */
        body.light {
            background: #f8fafc;
            color: #0f172a;
        }

        /* DARK */
        body.dark {
            background: #0f172a;
            color: #e2e8f0;
        }

        /* Cards */
        body.dark .card {
            background: #1e293b;
            border: 1px solid #334155;
        }

        body.light .card {
            background: #ffffff;
        }

        /* Footer */
        .footer {
            padding: 20px;
            text-align: center;
        }

        body.dark .footer {
            background: #020617;
            color: #64748b;
        }

        body.light .footer {
            background: #e2e8f0;
            color: #475569;
        }

        /* Layout */
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
        }
    </style>
</head>

<body class="light">

<!-- NAVBAR -->
<nav id="mainNav" class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">🚀 MIT Training</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/courses">Courses</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contact">Contact</a>
                </li>

                <!-- Theme Toggle -->
                <li class="nav-item ms-lg-3">
                    <button onclick="toggleTheme()" id="themeBtn" class="btn btn-outline-secondary btn-sm">
                        🌙
                    </button>
                </li>

                <li class="nav-item ms-lg-2">
                    <a class="btn btn-primary btn-sm" href="/login">Login</a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<!-- FLASH -->
<div class="container mt-3">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
</div>

<!-- CONTENT -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

<!-- FOOTER -->
<div class="footer">
    <p>© 2026 MIT Training Center</p>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function toggleTheme() {
    const body = document.body;
    const nav = document.getElementById("mainNav");
    const btn = document.getElementById("themeBtn");

    if (body.classList.contains("light")) {
        body.classList.replace("light", "dark");

        nav.classList.remove("navbar-light", "bg-white");
        nav.classList.add("navbar-dark", "bg-dark");

        btn.innerText = "☀️";
        localStorage.setItem("theme", "dark");

    } else {
        body.classList.replace("dark", "light");

        nav.classList.remove("navbar-dark", "bg-dark");
        nav.classList.add("navbar-light", "bg-white");

        btn.innerText = "🌙";
        localStorage.setItem("theme", "light");
    }
}

// Load saved theme
window.onload = function () {
    const saved = localStorage.getItem("theme");
    const nav = document.getElementById("mainNav");
    const btn = document.getElementById("themeBtn");

    if (saved === "dark") {
        document.body.classList.replace("light", "dark");
        nav.classList.remove("navbar-light", "bg-white");
        nav.classList.add("navbar-dark", "bg-dark");
        btn.innerText = "☀️";
    }
};
</script>

</body>
</html>
