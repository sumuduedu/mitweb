{% extends "public_base.html" %}

{% block content %}

<!-- HERO -->
<div class="bg-primary text-white text-center py-5">
    <div class="container">
        <h1>Our Courses</h1>
        <p class="lead">Explore our professional training programs</p>
    </div>
</div>

<!-- COURSES -->
<div class="container mt-5">

    <div class="row">

        {% if courses %}
            {% for c in courses %}
            <div class="col-md-4">

                <div class="card h-100 mb-4">

                    <!-- Optional Image -->
                    <img src="https://source.unsplash.com/400x250/?technology"
                         class="card-img-top">

                    <div class="card-body d-flex flex-column">

                        <h5 class="fw-bold">{{ c.name }}</h5>

                        <p class="text-muted mb-1">
                            Duration: {{ c.duration }}
                        </p>

                        <p class="text-muted mb-3">
                            Fee: Rs. {{ c.fee }}
                        </p>

                        <!-- Push button down -->
                        <div class="mt-auto">
                            <a href="/login" class="btn btn-primary w-100">
                                Enroll Now
                            </a>
                        </div>

                    </div>

                </div>

            </div>
            {% endfor %}
        {% else %}
            <div class="text-center">
                <p>No courses available</p>
            </div>
        {% endif %}

    </div>

</div>

{% endblock %}
